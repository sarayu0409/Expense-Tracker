<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="container">

    <header>
        <div class="icon">☰</div>

        <h2>Expense Tracker</h2>

        <div class="icon"></div>
    </header>

    <h3>Hello, <span id="username"></span></h3>

    <!-- Balance -->
    <div class="balance">
        <p>Current Balance</p>
        <h1 id="balance">₹0</h1>
    </div>

    <!-- Income & Expense -->
    <div class="cards">

        <div class="card">
            <h3>Income</h3>
            <h2 id="income" class="income">₹0</h2>
        </div>

        <div class="card">
            <h3>Expense</h3>
            <h2 id="expense" class="expense">₹0</h2>
        </div>

    </div>

    <!-- Transactions -->
    <div class="transactions">

        <h3>Recent Transactions</h3>

        <select id="filter">
    <option value="All">All Transactions</option>
    <option value="Income">Income</option>
    <option value="Expense">Expense</option>
    </select>
    <input type="date" id="dateFilter">

    <br><br>
        <input
            type="text"
            id="search"
            placeholder="🔍 Search by Category..."
    >

    <br><br>
        <div id="transactionList"></div>

    </div>

    <!-- Add Button -->
    <button onclick="location.href='add.html'">
        + Add Transaction
    </button>

</div>
<script src="js/script.js"></script>

</body>
</html>
